name: movie-tracker

services:
  movie:
    build: .
    container_name: movie-tracker
    restart: unless-stopped
    # NO published port. 8551 used to be here for LAN convenience, back when
    # this was single-user Streamlit. Once Matinee trusted X-Platform-User it
    # became the opposite: Docker's rules sit in front of UFW, so any device on
    # the home network could send that header and be anybody. The gateway
    # reaches this as movie-tracker:8501 over the Docker network and never used
    # the published port at all.
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      # warehouse still holds the OLD movie.* tables, untouched, so the
      # migration can be re-run and the old app still starts. The new one reads
      # and writes `platform`, where "user" lives — reviews reference it, and
      # Postgres has no cross-database foreign key.
      PGDATABASE: warehouse
      MOVIE_SCHEMA: movie
      MATINEE_DB: platform
      BROKER_URL: http://172.30.0.1:8610
    env_file:
      - ./secrets/app.env    # PGUSER, PGPASSWORD, TMDB_API_TOKEN, GATEWAY_TOKEN
    cap_drop: [NET_RAW]
    # Least privilege, per devondoes/SPEC-network.md. The networks are created
    # by devondoes/ops/networks.sh.
    networks:
      front_matinee: {}        # the gateway: matinee.devondoes.dev
      db_matinee: {}           # Postgres, as `postgres`
      host_broker:             # the AI broker on the host, and out to TMDB
        ipv4_address: 172.30.0.11

networks:
  front_matinee:
    external: true
  db_matinee:
    external: true
  host_broker:
    external: true
